version: 1
context: cic-yang

# Státuszok: pending | in_progress | done | blocked

entries:

  # ── Phase 1: Bootstrap ──────────────────────────────────────────────────────

  - task: "repo-bootstrap"
    status: done
    priority: 1
    milestone: bootstrap
    prompt: |
      Bootstrap cic-yang repót cic-primitives@v0.1.2-ből.
      project.yaml, dependency.yaml, CLAUDE.md, ai/ testreszabása.
      YANGBlock kind hozzáadása az index.yaml-hoz.
    accept: make validate
    produces:
      - project.yaml
      - dependency.yaml
      - CLAUDE.md
      - ai/
      - schemas/index.yaml (YANGBlock kind)

  # ── Phase 2: RFC 8343 building blockok ─────────────────────────────────────

  - task: "ietf-interfaces-physical"
    status: pending
    priority: 2
    milestone: rfc8343
    blocked_by: "repo-bootstrap"
    prompt: |
      Hozd létre az RFC 8343 fizikai interfész building blockot:
      schemas/ietf/ietf-interfaces-physical.yaml
      kind: YANGBlock, yang_module: ietf-interfaces, yang_source: RFC 8343
      interface_types: [ethernetCsmacd, ieee8023adLag]
      config mezők: name, type, description, enabled, mtu, speed, duplex, connector
      state mezők: admin-status, oper-status, speed (tényleges), duplex (tényleges),
                   phys-address (MAC), statistics (rx/tx packets, errors, discards)
    accept: make validate
    produces:
      - schemas/ietf/ietf-interfaces-physical.yaml

  - task: "ietf-interfaces-logical"
    status: pending
    priority: 3
    milestone: rfc8343
    blocked_by: "repo-bootstrap"
    prompt: |
      Hozd létre az RFC 8343 logikai interfész building blockot:
      schemas/ietf/ietf-interfaces-logical.yaml
      kind: YANGBlock, yang_source: RFC 8343
      interface_types: [softwareLoopback, bridge, ieee8023adLag (bond), other]
      config mezők: name, type, description, enabled, mtu
      state mezők: admin-status, oper-status, statistics
      higher-layer-if / lower-layer-if relációk (opcionális szülő/gyerek ref)
    accept: make validate
    produces:
      - schemas/ietf/ietf-interfaces-logical.yaml

  - task: "ietf-interfaces-vlan"
    status: pending
    priority: 4
    milestone: rfc8343
    blocked_by: "repo-bootstrap"
    prompt: |
      Hozd létre az RFC 8343 VLAN building blockot:
      schemas/ietf/ietf-interfaces-vlan.yaml
      kind: YANGBlock, yang_source: RFC 8343
      interface_types: [l2vlan]
      config mezők: vlan-id, vlan-mode (access/trunk/hybrid), allowed-vlans
      dhcp_service: ref (DHCP service máshol definiált — csak pointer)
      state mezők: oper-status
    accept: make validate
    produces:
      - schemas/ietf/ietf-interfaces-vlan.yaml

  - task: "ietf-interfaces-tunnel"
    status: pending
    priority: 5
    milestone: rfc8343
    blocked_by: "repo-bootstrap"
    prompt: |
      Hozd létre az RFC 8343 tunnel building blockot:
      schemas/ietf/ietf-interfaces-tunnel.yaml
      kind: YANGBlock, yang_source: RFC 8343
      interface_types: [tunnel, other]
      tunnel_types: [vxlan, gre, ipip]
      config mezők: tunnel-type, local-endpoint, remote-endpoint, vni (VXLAN)
      state mezők: oper-status, encap-stats
    accept: make validate
    produces:
      - schemas/ietf/ietf-interfaces-tunnel.yaml

  # ── Phase 3: RFC 8344 building blockok ─────────────────────────────────────

  - task: "ietf-ip-v4"
    status: pending
    priority: 6
    milestone: rfc8344
    blocked_by: "ietf-interfaces-physical"
    prompt: |
      Hozd létre az RFC 8344 IPv4 building blockot:
      schemas/ietf/ietf-ip-v4.yaml
      kind: YANGBlock, yang_source: RFC 8344
      Netplan-derivált struktúra:
      config mezők: addresses (list of CIDR), gateway4, nameservers.addresses,
                    nameservers.search, routes (to/via/metric), metric
      state mezők: assigned addresses (forrással: static/dhcp/link-local)
    accept: make validate
    produces:
      - schemas/ietf/ietf-ip-v4.yaml

  - task: "ietf-ip-v6"
    status: pending
    priority: 7
    milestone: rfc8344
    blocked_by: "ietf-interfaces-physical"
    prompt: |
      Hozd létre az RFC 8344 IPv6 building blockot:
      schemas/ietf/ietf-ip-v6.yaml
      kind: YANGBlock, yang_source: RFC 8344
      Netplan-derivált struktúra:
      config mezők: addresses (list of IPv6 CIDR), gateway6, nameservers,
                    routes, accept-ra (router advertisement), privacy-extensions
      state mezők: assigned addresses (forrással: static/dhcp/slaac/link-local)
    accept: make validate
    produces:
      - schemas/ietf/ietf-ip-v6.yaml

  # ── Phase 4: Első signed release ────────────────────────────────────────────

  - task: "signed-release"
    status: pending
    priority: 8
    milestone: release
    blocked_by: "ietf-ip-v6"
    prompt: |
      Első signed release: yang/releases/v0.1.0
      make release → yang/@v0.1.0 tag
    accept: make validate && git tag -l "yang/@v*"
