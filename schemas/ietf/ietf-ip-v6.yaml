---
metadata:
  name: ietf-ip-v6
  source: RFC 8344 — A YANG Data Model for IP Management
  version: v0.0.dev
  description: >
    IPv6 konfiguráció building block — RFC 8344 ietf-ip augmentáció CIC adaptációja,
    netplan-kompatibilis struktúrával. Mindig egy interfészhez kötött, sosem standalone.
  owner: Gabor Zoltan Sinko
  tags:
    - yang-block
    - ietf
    - rfc8344
    - ipv6
  validatedBy:
    name: cic-primitives
    version: v0.1.2

spec:
  kind: YANGBlock
  yang_module: ietf-ip
  yang_source: RFC 8344
  ip_version: ipv6

  standalone: false     # mindig interfészhez kötött

  config:
    - name: addresses
      type: list
      mandatory: false
      description: Statikus IPv6 cím(ek) CIDR formátumban (pl. 2001:db8::1/64)
      item_fields:
        - name: address
          type: string
          role: key
          description: IPv6 cím prefix-hosszal (CIDR)
        - name: label
          type: string
          mandatory: false

    - name: gateway6
      type: string
      mandatory: false
      description: Default IPv6 gateway cím

    - name: nameservers
      type: object
      mandatory: false
      description: DNS konfiguráció (IPv6 forrású is lehet)
      properties:
        addresses:
          type: list
          item_type: string
        search:
          type: list
          item_type: string

    - name: routes
      type: list
      mandatory: false
      description: Statikus IPv6 route-ok
      item_fields:
        - name: to
          type: string
          role: key
          description: Célhálózat IPv6 CIDR vagy "default"
        - name: via
          type: string
          mandatory: false
          description: Next-hop IPv6 gateway
        - name: metric
          type: integer
          mandatory: false
          default: 100

    - name: accept_ra
      type: boolean
      mandatory: false
      default: true
      description: Router Advertisement fogadása és SLAAC engedélyezése

    - name: privacy_extensions
      type: boolean
      mandatory: false
      default: false
      description: RFC 4941 privacy extensions (ideiglenes cím generálás)

    - name: dhcp6_overrides
      type: object
      mandatory: false
      description: DHCPv6 kliens finomhangolása
      properties:
        use_dns:
          type: boolean
          default: true
        use_routes:
          type: boolean
          default: true
        rapid_commit:
          type: boolean
          default: false

  state:
    - name: assigned_addresses
      type: list
      mandatory: false
      description: Ténylegesen kiosztott IPv6 cím(ek)
      item_fields:
        - name: address
          type: string
          role: key
          description: IPv6 cím CIDR formátumban
        - name: origin
          type: enum
          values: [static, dhcpv6, slaac, link_local, other]
          description: Cím forrása
        - name: status
          type: enum
          values: [preferred, deprecated, invalid, inaccessible, unknown, tentative, duplicate]
          description: RFC 4862 cím állapot (DAD eredmény)
        - name: lease_expiry
          type: string
          mandatory: false
          description: DHCPv6 bérleti idő lejárta (ISO 8601)
