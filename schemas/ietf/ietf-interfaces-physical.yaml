---
metadata:
  name: ietf-interfaces-physical
  source: RFC 8343 — A YANG Data Model for Interface Management
  version: v0.0.dev
  description: >
    Fizikai hálózati interfész building block — ethernetCsmacd és ieee8023adLag
    (LAG/bond) típusok. RFC 8343 config/state tree CIC adaptációja.
  owner: Gabor Zoltan Sinko
  tags:
    - yang-block
    - ietf
    - rfc8343
    - physical
  validatedBy:
    name: cic-primitives
    version: v0.1.2

spec:
  kind: YANGBlock
  yang_module: ietf-interfaces
  yang_source: RFC 8343
  interface_types:
    - ethernetCsmacd      # standard Ethernet
    - ieee8023adLag       # LAG / bond / port-channel

  config:
    - name: name
      type: string
      mandatory: true
      role: key
      description: Interfész neve (pl. eth0, ge-0/0/1, GigabitEthernet0/0/1)

    - name: description
      type: string
      mandatory: false
      description: Emberi olvasható leírás

    - name: enabled
      type: boolean
      default: true
      mandatory: true
      description: Adminisztrációs állapot — true=up, false=down

    - name: mtu
      type: integer
      range: "68..9216"
      mandatory: false
      default: 1500
      description: Maximum Transmission Unit (byte)

    - name: speed
      type: integer
      mandatory: false
      description: Konfigurált port sebesség (Mbps) — null = auto-negotiate

    - name: duplex
      type: enum
      values: [full, half, auto]
      mandatory: false
      default: auto
      description: Duplex mód

    - name: connector_type
      type: enum
      values: [rj45, sfp, sfp_plus, qsfp, qsfp28, backplane, other]
      mandatory: false
      description: Fizikai csatlakozó típusa

    # LAG-specifikus (ieee8023adLag esetén)
    - name: lag_members
      type: list
      item_type: string
      mandatory: false
      capability: lag
      description: LAG taginterfészek nevei (csak ieee8023adLag típusnál)

    - name: lag_mode
      type: enum
      values: [active, passive, static]
      mandatory: false
      capability: lag
      description: LACP mód (active=LACP küld, passive=LACP fogad, static=nincs LACP)

  state:
    - name: admin_status
      type: enum
      values: [up, down, testing]
      mandatory: true
      description: Konfigurált adminisztrációs állapot

    - name: oper_status
      type: enum
      values: [up, down, testing, unknown, dormant, not_present, lower_layer_down]
      mandatory: true
      description: >
        Tényleges operációs állapot — adapter normalizálja a platform értékeket.
        lower_layer_down: szülő interfész (pl. LAG uplink) nincs fenn.

    - name: phys_address
      type: string
      mandatory: false
      description: MAC cím (pl. 00:1a:2b:3c:4d:5e)

    - name: speed_actual
      type: integer
      mandatory: false
      description: Tényleges tárgyalt sebesség (Mbps)

    - name: duplex_actual
      type: enum
      values: [full, half, unknown]
      mandatory: false
      description: Tényleges duplex mód

    - name: last_change
      type: string
      mandatory: false
      description: Utolsó oper_status változás időbélyege (ISO 8601)

    - name: statistics
      type: object
      mandatory: false
      description: Forgalmi számlálók
      properties:
        in_octets: integer
        in_pkts: integer
        in_errors: integer
        in_discards: integer
        out_octets: integer
        out_pkts: integer
        out_errors: integer
        out_discards: integer

  notifications:
    - name: link-up
      description: Interfész oper_status up-ra váltott
      payload:
        - name: interface_name
          type: string
        - name: oper_status
          type: string

    - name: link-down
      description: Interfész oper_status down-ra váltott
      payload:
        - name: interface_name
          type: string
        - name: oper_status
          type: string
