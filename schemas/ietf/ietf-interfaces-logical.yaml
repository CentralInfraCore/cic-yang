---
metadata:
  name: ietf-interfaces-logical
  source: RFC 8343 — A YANG Data Model for Interface Management
  version: v0.0.dev
  description: >
    Logikai hálózati interfész building block — loopback, bridge (OVS/Linux),
    önálló logikai interfészek. Fizikai szülő opcionális — létezhet standalone.
  owner: Gabor Zoltan Sinko
  tags:
    - yang-block
    - ietf
    - rfc8343
    - logical
  validatedBy:
    name: cic-primitives
    version: v0.1.2

spec:
  kind: YANGBlock
  yang_module: ietf-interfaces
  yang_source: RFC 8343
  interface_types:
    - softwareLoopback   # loopback interfész
    - bridge             # Linux bridge / OVS bridge
    - other              # általános logikai interfész (SVI, subinterface)

  config:
    - name: name
      type: string
      mandatory: true
      role: key
      description: Interfész neve (pl. lo, ovs-br0, vmbr0, bond0)

    - name: type
      type: enum
      values: [loopback, bridge, subinterface, svi, other]
      mandatory: true
      description: Logikai interfész altípusa

    - name: description
      type: string
      mandatory: false

    - name: enabled
      type: boolean
      default: true
      mandatory: true

    - name: mtu
      type: integer
      range: "68..9216"
      mandatory: false
      default: 1500

    # Szülő-gyerek relációk (RFC 8343 higher/lower-layer-if analóg)
    - name: lower_layer_if
      type: list
      item_type: string
      mandatory: false
      description: >
        Alsó réteg interfészek nevei — pl. bridge esetén a tag/untag portok,
        bond esetén a taginterfészek. OVS bridge esetén az uplink fizikai port.

    - name: higher_layer_if
      type: string
      mandatory: false
      description: >
        Felső réteg interfész neve — pl. ha ez az interfész egy bridge portja.

  state:
    - name: admin_status
      type: enum
      values: [up, down, testing]
      mandatory: true

    - name: oper_status
      type: enum
      values: [up, down, testing, unknown, dormant, not_present, lower_layer_down]
      mandatory: true

    - name: phys_address
      type: string
      mandatory: false
      description: MAC cím (bridge esetén a bridge MAC-je)

    - name: last_change
      type: string
      mandatory: false

    - name: statistics
      type: object
      mandatory: false
      properties:
        in_octets: integer
        in_pkts: integer
        in_errors: integer
        out_octets: integer
        out_pkts: integer
        out_errors: integer
